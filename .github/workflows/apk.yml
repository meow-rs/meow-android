name: APK

# Installable build for phones: the R8-minified release variant for
# arm64-v8a, so R8 keep-rule regressions surface before a release is cut.
# On `main` the `sign` job signs it with the release key, so it updates a
# GitHub release in place and the other way round. Anywhere else (PRs, a
# dispatch on a branch) it is signed with a throwaway key generated per run:
# installing that one means uninstalling any other Meow build first.
on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    # ubuntu-24.04, not ubuntu-latest: ubuntu-26.04 ships libclang 22, and the
    # bindgen 0.69 that madeye/lwip's build script uses reads its records with
    # no fields ("no field `mtu` on type `lwip::netif`"). Move on once
    # lwip's bindgen is 0.72 or newer.
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Cargo cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/cargo-ndk
            core/src/main/rust/meow-android-ffi/target
          key: cargo-${{ runner.os }}-arm64-release-${{ hashFiles('core/src/main/rust/**/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-arm64-release-

      - name: Install Android NDK
        run: |
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;28.2.13676358" "ndk;27.0.12077973"
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Install cargo-ndk
        run: command -v cargo-ndk || cargo install cargo-ndk

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v6

      # No KEYSTORE_PATH, so AGP leaves the release APK unsigned.
      - name: Build release APK (arm64-v8a)
        run: ./gradlew :mobile:assembleRelease -PTARGET_ABI=arm64 -PCARGO_PROFILE=release

      - name: Align
        run: |
          bt=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$bt/zipalign" -f 4 mobile/build/outputs/apk/release/mobile-release-unsigned.apk "$RUNNER_TEMP/aligned.apk"

      # Only `main` and `v*` tags can use the `release` environment's key.
      - name: Sign with a throwaway key
        if: github.ref != 'refs/heads/main'
        run: |
          keytool -genkeypair -keystore "$RUNNER_TEMP/ci.keystore" -storepass android -keypass android \
            -alias ci -keyalg RSA -keysize 2048 -validity 3650 -dname "CN=Meow CI test build"
          bt=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          apk="meow-${GITHUB_SHA::7}-arm64-v8a.apk"
          "$bt/apksigner" sign --ks "$RUNNER_TEMP/ci.keystore" --ks-pass pass:android --ks-key-alias ci \
            --out "$apk" "$RUNNER_TEMP/aligned.apk"
          "$bt/apksigner" verify "$apk"
          ls -l "$apk"
          echo "APK=$apk" >> "$GITHUB_ENV"

      - name: Upload the unsigned APK for signing
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: meow-arm64-v8a-unsigned
          path: ${{ runner.temp }}/aligned.apk
          retention-days: 1
          compression-level: 0

      - name: Upload APK
        if: github.ref != 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: meow-arm64-v8a-apk
          path: ${{ env.APK }}
          retention-days: 14
          # An APK is already a zip.
          compression-level: 0

  # Signs `main`'s APK with the release key, in a job of its own: the key
  # never shares a runner with the Gradle and cargo build scripts.
  sign:
    needs: apk
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: release

    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts

      - uses: actions/download-artifact@v4
        with:
          name: meow-arm64-v8a-unsigned
          path: ${{ runner.temp }}/unsigned

      - name: Sign with the release key
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          apk="meow-${GITHUB_SHA::7}-arm64-v8a.apk"
          .github/scripts/sign-apk.sh "$RUNNER_TEMP/unsigned/aligned.apk" "$apk"
          echo "APK=$apk" >> "$GITHUB_ENV"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: meow-arm64-v8a-apk
          path: ${{ env.APK }}
          retention-days: 14
          # An APK is already a zip.
          compression-level: 0
