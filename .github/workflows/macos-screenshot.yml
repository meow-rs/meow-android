name: macOS Android screenshot

on:
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  proxy-servers:
    runs-on: macos-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-linux-android

      - name: Cargo cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/cargo-ndk
            core/src/main/rust/meow-android-ffi/target
          key: cargo-${{ runner.os }}-x86_64-screenshot-${{ hashFiles('core/src/main/rust/**/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-x86_64-screenshot-

      - name: Install Android NDK
        run: |
          echo "y" | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "emulator" "platform-tools" "platforms;android-35" \
            "system-images;android-35;google_apis;x86_64" \
            "ndk;28.2.13676358" "ndk;27.0.12077973"
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Install build tools
        run: |
          command -v cargo-ndk || cargo install cargo-ndk
          SS_VERSION=1.25.0
          mkdir -p "$HOME/.cargo/bin"
          curl -fsSL "https://github.com/shadowsocks/shadowsocks-rust/releases/download/v${SS_VERSION}/shadowsocks-v${SS_VERSION}.x86_64-apple-darwin.tar.xz" \
            | tar -xJ -C "$HOME/.cargo/bin" ssserver
          chmod +x "$HOME/.cargo/bin/ssserver"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v6

      - name: Build x86_64 debug APK for the emulator
        run: ./gradlew :mobile:assembleDebug -PTARGET_ABI=x86_64 -PCARGO_PROFILE=debug

      - name: Boot emulator and capture Proxy Servers
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          script: |
            ADB="$ANDROID_HOME/platform-tools/adb" \
            EMULATOR="$ANDROID_HOME/emulator/emulator" \
            APK="$GITHUB_WORKSPACE/mobile/build/outputs/apk/debug/mobile-debug.apk" \
            SSSERVER=ssserver \
            SCREENSHOT_PROXY_SERVERS=true \
            SKIP_EMULATOR_BOOT=true \
            TUN_WAIT_SECS=120 \
            ./test-e2e.sh

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: proxy-servers-macos-screenshots
          path: screen_*.png
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: proxy-servers-macos-diagnostics
          path: |
            e2e-logcat.log
            ui_dump_*.xml
          if-no-files-found: ignore
          retention-days: 14
